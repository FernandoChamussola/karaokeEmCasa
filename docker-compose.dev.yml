services:
  karaoke:
    container_name: karaoke-dev
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data        # músicas processadas (ficam no teu PC, em ./data)
      - models:/models      # modelos de IA descarregados (só na primeira vez)
    environment:
      # tiny | base | small | medium | large-v3-turbo  (maior = melhor letra, mais lento)
      WHISPER_MODEL: medium
      # htdemucs (rápido) | htdemucs_ft (um pouco melhor, ~4x mais lento)
      DEMUCS_MODEL: htdemucs
      # Senha de acesso (vazia = sem login). Vem do ficheiro .env
      APP_PASSWORD: ${APP_PASSWORD:-}
      POT_PROVIDER_URL: http://pot-provider:4416
    depends_on:
      - pot-provider
    restart: unless-stopped

  # Gera os "PO tokens" que o YouTube pede para provar que não é um robô.
  # Sem isto, o YouTube bloqueia os downloads feitos a partir de servidores.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: karaoke-pot-dev
    init: true
    restart: unless-stopped

volumes:
  models:
